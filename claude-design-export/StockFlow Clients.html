<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockFlow — Clients</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; }
  :root {
    --primary: #1e3a5f;
    --green: #10b981;
    --bg: #f3f4f6;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --red: #ef4444;
    --orange: #f59e0b;
  }
  input, select, button, textarea { font-family: 'Inter', sans-serif; }
  input:focus, select:focus, textarea:focus { outline: none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ── Icons ─────────────────────────────────────────────────
const Icon = ({ name, size = 16, color = 'currentColor', sw = 1.8 }) => {
  const p = {
    back:    <polyline points="15 18 9 12 15 6"/>,
    search:  <><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    plus:    <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    edit:    <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></>,
    trash:   <><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></>,
    user:    <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
    phone:   <><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.62 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6.18 6.18l.91-.91a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></>,
    map:     <><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></>,
    calendar:<><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
    trend:   <><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>,
    eye:     <><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,
    check:   <polyline points="20 6 9 17 4 12"/>,
    x:       <><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    shield:  <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>,
    sort:    <><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round">
      {p[name]}
    </svg>
  );
};

// ── Helpers ────────────────────────────────────────────────
const fmt = (n) => n.toLocaleString('fr-FR') + ' FCFA';
const AVATAR_COLORS = ['#1e3a5f','#10b981','#f59e0b','#8b5cf6','#ef4444','#0ea5e9'];

// ── Data ───────────────────────────────────────────────────
const INITIAL_CLIENTS = [
  { id:0, name:'Client standard',      phone:'—',                  adresse:'—',             total:245000,   lastVisit:'2026-04-19', default:true  },
  { id:1, name:'Restaurant Le Phare',  phone:'+229 97 12 34 56',   adresse:'Cotonou Centre', total:1250000,  lastVisit:'2026-04-19', default:false },
  { id:2, name:'Bar Central',          phone:'+229 96 78 90 12',   adresse:'Akpakpa',        total:890000,   lastVisit:'2026-04-18', default:false },
  { id:3, name:'Épicerie du Coin',     phone:'+229 95 34 56 78',   adresse:'Godomey',        total:456000,   lastVisit:'2026-04-17', default:false },
  { id:4, name:'Hôtel Marina',         phone:'+229 94 90 12 34',   adresse:'Marina',         total:2100000,  lastVisit:'2026-04-19', default:false },
  { id:5, name:'Supermarché Prix Bas', phone:'+229 93 56 78 90',   adresse:'Calavi',         total:780000,   lastVisit:'2026-04-16', default:false },
];

// ── Client Modal (new / edit) ──────────────────────────────
function ClientModal({ client, onSave, onClose }) {
  const isEdit = !!client;
  const [name, setName]       = React.useState(client?.name    || '');
  const [phone, setPhone]     = React.useState(client?.phone   || '');
  const [adresse, setAdresse] = React.useState(client?.adresse || '');

  const handleSave = () => {
    if (!name.trim()) return;
    onSave({
      id: client?.id ?? Date.now(),
      name, phone: phone||'—', adresse: adresse||'—',
      total: client?.total ?? 0,
      lastVisit: client?.lastVisit ?? new Date().toISOString().slice(0,10),
      default: false,
    });
  };

  const fields = [
    { label:'Nom du client *', val:name, set:setName, icon:'user', placeholder:'Ex: Bar Central', type:'text' },
    { label:'Téléphone',       val:phone, set:setPhone, icon:'phone', placeholder:'+229 97 XX XX XX', type:'tel' },
    { label:'Adresse',         val:adresse, set:setAdresse, icon:'map', placeholder:'Quartier, Ville', type:'text' },
  ];

  return (
    <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.48)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
      <div style={{ background:'#fff', borderRadius:14, width:'100%', maxWidth:440, boxShadow:'0 24px 64px rgba(0,0,0,0.2)', display:'flex', flexDirection:'column' }}>
        <div style={{ padding:'18px 20px', borderBottom:'1px solid var(--border)', display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ width:36,height:36,borderRadius:10,background:'#eff6ff',display:'flex',alignItems:'center',justifyContent:'center' }}>
            <Icon name="user" size={17} color="var(--primary)" sw={2}/>
          </div>
          <span style={{ fontWeight:700, fontSize:16, color:'var(--text)', flex:1 }}>{isEdit ? 'Modifier le client' : 'Nouveau client'}</span>
          <button onClick={onClose} style={{ background:'none', border:'none', cursor:'pointer', padding:4, borderRadius:6, display:'flex' }}
            onMouseEnter={e=>e.currentTarget.style.background='#f3f4f6'} onMouseLeave={e=>e.currentTarget.style.background='none'}>
            <Icon name="x" size={18} color="var(--muted)"/>
          </button>
        </div>
        <div style={{ padding:'18px 20px', display:'flex', flexDirection:'column', gap:14 }}>
          {fields.map(f => (
            <div key={f.label}>
              <label style={{ fontSize:11, fontWeight:600, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.04em', display:'block', marginBottom:5 }}>{f.label}</label>
              <div style={{ position:'relative' }}>
                <div style={{ position:'absolute', left:11, top:'50%', transform:'translateY(-50%)' }}>
                  <Icon name={f.icon} size={15} color="var(--muted)"/>
                </div>
                <input type={f.type} value={f.val} onChange={e=>f.set(e.target.value)} placeholder={f.placeholder}
                  style={{ width:'100%', padding:'10px 12px 10px 36px', border:'1.5px solid var(--border)', borderRadius:9, fontSize:13, color:'var(--text)', background:'#f9fafb' }}
                  onFocus={e=>e.target.style.borderColor='var(--green)'}
                  onBlur={e=>e.target.style.borderColor='var(--border)'}/>
              </div>
            </div>
          ))}
        </div>
        <div style={{ padding:'14px 20px', borderTop:'1px solid var(--border)', display:'flex', gap:10 }}>
          <button onClick={onClose} style={{ flex:1, padding:'10px', background:'#f3f4f6', border:'none', borderRadius:8, fontWeight:600, fontSize:13, color:'var(--muted)', cursor:'pointer' }}>Annuler</button>
          <button onClick={handleSave} style={{ flex:2, padding:'10px', background:'var(--green)', border:'none', borderRadius:8, fontWeight:700, fontSize:13, color:'#fff', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', gap:6 }}>
            <Icon name="check" size={14} color="#fff" sw={2.5}/> {isEdit ? 'Enregistrer' : 'Créer le client'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Delete confirm ─────────────────────────────────────────
function DeleteConfirm({ client, onConfirm, onCancel }) {
  return (
    <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.48)', zIndex:200, display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
      <div style={{ background:'#fff', borderRadius:14, padding:28, maxWidth:360, width:'100%', boxShadow:'0 24px 64px rgba(0,0,0,0.2)', textAlign:'center' }}>
        <div style={{ width:52,height:52,borderRadius:'50%',background:'#fee2e2',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px' }}>
          <Icon name="trash" size={22} color="var(--red)"/>
        </div>
        <div style={{ fontWeight:700, fontSize:16, color:'var(--text)', marginBottom:8 }}>Supprimer ce client ?</div>
        <div style={{ fontSize:13, color:'var(--muted)', marginBottom:24 }}>
          «&nbsp;{client.name}&nbsp;» sera définitivement supprimé avec tout son historique.
        </div>
        <div style={{ display:'flex', gap:10 }}>
          <button onClick={onCancel} style={{ flex:1, padding:'10px', background:'#f3f4f6', border:'none', borderRadius:8, fontWeight:600, fontSize:13, color:'var(--muted)', cursor:'pointer' }}>Annuler</button>
          <button onClick={onConfirm} style={{ flex:1, padding:'10px', background:'var(--red)', border:'none', borderRadius:8, fontWeight:700, fontSize:13, color:'#fff', cursor:'pointer' }}>Supprimer</button>
        </div>
      </div>
    </div>
  );
}

// ── Fiche client (detail panel) ────────────────────────────
function FichePanel({ client, onClose, isMobile }) {
  const color = AVATAR_COLORS[client.id % AVATAR_COLORS.length];
  return (
    <div style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.48)', zIndex:200, display:'flex', alignItems:'center', justifyContent: isMobile?'flex-end':'center', flexDirection: isMobile?'column':'row' }}>
      <div style={{ background:'#fff', width: isMobile?'100%':420, height: isMobile?'82%':'auto', borderRadius: isMobile?'20px 20px 0 0':14, display:'flex', flexDirection:'column', boxShadow:'0 24px 64px rgba(0,0,0,0.2)', overflow:'hidden' }}>
        {/* Top banner */}
        <div style={{ background:'var(--primary)', padding:'20px 20px 28px', position:'relative' }}>
          <button onClick={onClose} style={{ position:'absolute', top:12, right:12, background:'rgba(255,255,255,0.12)', border:'none', borderRadius:8, cursor:'pointer', padding:6, display:'flex' }}>
            <Icon name="x" size={16} color="#fff"/>
          </button>
          <div style={{ width:60,height:60,borderRadius:'50%',background:color,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:10 }}>
            <span style={{ fontSize:22,fontWeight:800,color:'#fff' }}>{client.name[0]}</span>
          </div>
          <div style={{ color:'#fff', fontWeight:700, fontSize:18 }}>{client.name}</div>
          {client.default && (
            <span style={{ display:'inline-flex', alignItems:'center', gap:5, marginTop:6, background:'rgba(255,255,255,0.15)', color:'#fff', fontSize:11, fontWeight:600, padding:'3px 10px', borderRadius:20 }}>
              <Icon name="shield" size={11} color="#fff" sw={2}/> Client par défaut
            </span>
          )}
        </div>
        {/* Info */}
        <div style={{ flex:1, overflowY:'auto', padding:'18px 20px', display:'flex', flexDirection:'column', gap:12 }}>
          {/* Key stats */}
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
            <div style={{ background:'#f0fdf4', borderRadius:10, padding:'12px 14px' }}>
              <div style={{ fontSize:10,fontWeight:600,color:'#065f46',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:4 }}>Total achats</div>
              <div style={{ fontWeight:800, fontSize:16, color:'var(--green)' }}>{fmt(client.total)}</div>
            </div>
            <div style={{ background:'#eff6ff', borderRadius:10, padding:'12px 14px' }}>
              <div style={{ fontSize:10,fontWeight:600,color:'#1e40af',textTransform:'uppercase',letterSpacing:'0.04em',marginBottom:4 }}>Dernière visite</div>
              <div style={{ fontWeight:700, fontSize:14, color:'var(--primary)' }}>{client.lastVisit.split('-').reverse().join('/')}</div>
            </div>
          </div>
          {/* Details */}
          {[
            { icon:'phone', label:'Téléphone', val:client.phone },
            { icon:'map',   label:'Adresse',   val:client.adresse },
          ].map(r => (
            <div key={r.label} style={{ display:'flex', alignItems:'center', gap:12, padding:'11px 14px', background:'#f9fafb', borderRadius:9, border:'1px solid var(--border)' }}>
              <div style={{ width:32,height:32,borderRadius:8,background:'#fff',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0 }}>
                <Icon name={r.icon} size={15} color="var(--muted)"/>
              </div>
              <div>
                <div style={{ fontSize:10,fontWeight:600,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.04em' }}>{r.label}</div>
                <div style={{ fontSize:13,fontWeight:600,color:'var(--text)',marginTop:1 }}>{r.val}</div>
              </div>
            </div>
          ))}
          {/* Recent sales stub */}
          <div>
            <div style={{ fontSize:12,fontWeight:700,color:'var(--text)',marginBottom:8 }}>Dernières ventes</div>
            {[
              { date:'19/04/2026', montant:45000 },
              { date:'16/04/2026', montant:32000 },
              { date:'12/04/2026', montant:18500 },
            ].map((v,i)=>(
              <div key={i} style={{ display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 12px',background: i%2===0?'#f9fafb':'#fff',borderRadius:8,marginBottom:4,border:'1px solid #f3f4f6' }}>
                <div style={{ display:'flex',alignItems:'center',gap:8 }}>
                  <Icon name="calendar" size={13} color="var(--muted)" sw={1.8}/>
                  <span style={{ fontSize:12,color:'var(--muted)' }}>{v.date}</span>
                </div>
                <span style={{ fontSize:13,fontWeight:700,color:'var(--text)' }}>{fmt(v.montant)}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Main screen ────────────────────────────────────────────
function ClientsScreen({ isMobile=false }) {
  const [clients, setClients]   = React.useState(INITIAL_CLIENTS);
  const [search, setSearch]     = React.useState('');
  const [modal, setModal]       = React.useState(null);   // null | 'new' | client
  const [delTarget, setDelTarget] = React.useState(null);
  const [fiche, setFiche]       = React.useState(null);

  const filtered = clients.filter(c =>
    c.name.toLowerCase().includes(search.toLowerCase()) ||
    c.adresse.toLowerCase().includes(search.toLowerCase())
  );

  const totalCA = clients.filter(c=>!c.default).reduce((s,c)=>s+c.total,0);

  const saveClient = (c) => {
    setClients(prev => prev.some(x=>x.id===c.id) ? prev.map(x=>x.id===c.id?c:x) : [...prev,c]);
    setModal(null);
  };

  const deleteClient = (id) => { setClients(p=>p.filter(x=>x.id!==id)); setDelTarget(null); };

  const px = isMobile ? 14 : 24;

  const ActionBtn = ({ icon, color, title, onClick, disabled }) => (
    <button onClick={onClick} title={title} disabled={disabled}
      style={{ width:30, height:30, background:'none', border:'1px solid var(--border)', borderRadius:7, cursor:disabled?'not-allowed':'pointer', display:'flex', alignItems:'center', justifyContent:'center', opacity:disabled?0.3:1, transition:'background 0.1s' }}
      onMouseEnter={e=>{ if(!disabled){e.currentTarget.style.background=color+'18'; e.currentTarget.style.borderColor=color+'66'; }}}
      onMouseLeave={e=>{ e.currentTarget.style.background='none'; e.currentTarget.style.borderColor='var(--border)'; }}>
      <Icon name={icon} size={13} color={color} sw={2}/>
    </button>
  );

  return (
    <div style={{ height:'100%', display:'flex', flexDirection:'column', background:'var(--bg)', fontFamily:"'Inter',sans-serif", position:'relative', overflow:'hidden' }}>

      {/* HEADER */}
      <div style={{ background:'var(--primary)', padding:`${isMobile?13:18}px ${px}px`, flexShrink:0 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <button style={{ width:34,height:34,borderRadius:8,background:'rgba(255,255,255,0.1)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center' }}>
            <Icon name="back" size={18} color="#fff" sw={2}/>
          </button>
          <div style={{ flex:1 }}>
            <div style={{ color:'#fff', fontWeight:700, fontSize:isMobile?15:20 }}>Clients</div>
            <div style={{ color:'rgba(255,255,255,0.5)', fontSize:11, marginTop:1 }}>{clients.length} clients · {fmt(totalCA)} CA total</div>
          </div>
          <button onClick={() => setModal('new')}
            style={{ display:'flex', alignItems:'center', gap:6, background:'var(--green)', color:'#fff', border:'none', borderRadius:8, padding: isMobile?'8px 12px':'9px 16px', fontWeight:600, fontSize:isMobile?12:13, cursor:'pointer', boxShadow:'0 2px 8px rgba(16,185,129,0.35)' }}
            onMouseEnter={e=>e.currentTarget.style.background='#059669'}
            onMouseLeave={e=>e.currentTarget.style.background='var(--green)'}>
            <Icon name="plus" size={14} color="#fff" sw={2.5}/>
            {isMobile ? 'Nouveau' : 'Nouveau client'}
          </button>
        </div>
      </div>

      {/* SEARCH + STATS */}
      <div style={{ background:'#fff', borderBottom:'1px solid var(--border)', padding:`12px ${px}px`, flexShrink:0 }}>
        <div style={{ position:'relative' }}>
          <div style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)' }}>
            <Icon name="search" size={15} color="var(--muted)"/>
          </div>
          <input type="text" placeholder="Rechercher un client..."
            value={search} onChange={e=>setSearch(e.target.value)}
            style={{ width:'100%', padding:'10px 14px 10px 38px', border:'1.5px solid var(--border)', borderRadius:9, fontSize:13, color:'var(--text)', background:'#f9fafb' }}
            onFocus={e=>e.target.style.borderColor='var(--green)'}
            onBlur={e=>e.target.style.borderColor='var(--border)'}/>
        </div>
        {!isMobile && (
          <div style={{ display:'flex', gap:24, marginTop:10, paddingTop:10, borderTop:'1px solid #f3f4f6' }}>
            {[
              { label:'Total clients', val:clients.length, color:'var(--primary)' },
              { label:'CA cumulé', val: fmt(totalCA), color:'var(--green)', trend:true },
              { label:'Meilleur client', val: clients.filter(c=>!c.default).sort((a,b)=>b.total-a.total)[0]?.name.split(' ')[0] || '—', color:'var(--orange)' },
            ].map(s=>(
              <div key={s.label} style={{ display:'flex', alignItems:'center', gap:6 }}>
                {s.trend && <Icon name="trend" size={13} color="var(--green)" sw={2}/>}
                <span style={{ fontWeight:800, fontSize:s.trend?15:18, color:s.color }}>{s.val}</span>
                <span style={{ fontSize:12, color:'var(--muted)' }}>{s.label}</span>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* TABLE / CARDS */}
      <div style={{ flex:1, overflowY:'auto', padding:`16px ${px}px` }}>

        {/* DESKTOP TABLE */}
        {!isMobile && (
          <div style={{ background:'#fff', borderRadius:12, overflow:'hidden', boxShadow:'0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04)' }}>
            {/* Header row */}
            <div style={{ display:'grid', gridTemplateColumns:'2fr 1.4fr 1.3fr 1.4fr 1.1fr 100px', padding:'11px 20px', background:'#f8fafc', borderBottom:'1px solid var(--border)' }}>
              {['Client','Téléphone','Adresse','Total achats','Dernière visite','Actions'].map((h,i)=>(
                <div key={h} style={{ fontSize:11, fontWeight:700, color:'var(--muted)', textTransform:'uppercase', letterSpacing:'0.05em', textAlign:i>=5?'center':'left' }}>{h}</div>
              ))}
            </div>
            {/* Rows */}
            {filtered.length === 0 ? (
              <div style={{ padding:'48px 20px', textAlign:'center', color:'var(--muted)', fontSize:13 }}>Aucun client trouvé.</div>
            ) : filtered.map((c, ri) => {
              const color = AVATAR_COLORS[c.id % AVATAR_COLORS.length];
              return (
                <div key={c.id} style={{
                  display:'grid', gridTemplateColumns:'2fr 1.4fr 1.3fr 1.4fr 1.1fr 100px',
                  padding:'13px 20px', alignItems:'center',
                  borderBottom: ri<filtered.length-1?'1px solid #f3f4f6':'none',
                  transition:'background 0.1s', cursor:'pointer',
                }}
                  onMouseEnter={e=>e.currentTarget.style.background='#f9fafb'}
                  onMouseLeave={e=>e.currentTarget.style.background='#fff'}
                  onClick={()=>setFiche(c)}
                >
                  {/* Name + avatar */}
                  <div style={{ display:'flex', alignItems:'center', gap:10 }}>
                    <div style={{ width:36,height:36,borderRadius:'50%',background:color,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0 }}>
                      <span style={{ fontSize:13,fontWeight:700,color:'#fff' }}>{c.name[0]}</span>
                    </div>
                    <div>
                      <div style={{ fontWeight:600, fontSize:14, color:'var(--text)' }}>{c.name}</div>
                      {c.default && (
                        <span style={{ display:'inline-flex', alignItems:'center', gap:4, background:'#eff6ff', color:'var(--primary)', fontSize:10, fontWeight:700, padding:'1px 7px', borderRadius:20, marginTop:2 }}>
                          <Icon name="shield" size={9} color="var(--primary)" sw={2.5}/> Client par défaut
                        </span>
                      )}
                    </div>
                  </div>
                  {/* Phone */}
                  <div style={{ fontSize:13, color: c.phone==='—'?'var(--muted)':'var(--text)', display:'flex', alignItems:'center', gap:6 }}>
                    {c.phone!=='—' && <Icon name="phone" size={12} color="var(--muted)" sw={1.8}/>}
                    {c.phone}
                  </div>
                  {/* Address */}
                  <div style={{ fontSize:13, color: c.adresse==='—'?'var(--muted)':'var(--text)', display:'flex', alignItems:'center', gap:6, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>
                    {c.adresse!=='—' && <Icon name="map" size={12} color="var(--muted)" sw={1.8}/>}
                    {c.adresse}
                  </div>
                  {/* Total */}
                  <div style={{ fontWeight:700, fontSize:14, color:'var(--text)' }}>{fmt(c.total)}</div>
                  {/* Last visit */}
                  <div style={{ fontSize:13, color:'var(--muted)', display:'flex', alignItems:'center', gap:5 }}>
                    <Icon name="calendar" size={12} color="var(--muted)" sw={1.8}/>
                    {c.lastVisit.split('-').reverse().join('/')}
                  </div>
                  {/* Actions */}
                  <div style={{ display:'flex', justifyContent:'center', gap:4 }} onClick={e=>e.stopPropagation()}>
                    <ActionBtn icon="eye"  color="var(--primary)" title="Voir fiche"  onClick={()=>setFiche(c)}/>
                    <ActionBtn icon="edit" color="#1e3a5f"        title="Modifier"   onClick={()=>setModal(c)} disabled={c.default}/>
                    <ActionBtn icon="trash" color="var(--red)"   title="Supprimer"  onClick={()=>setDelTarget(c)} disabled={c.default}/>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* MOBILE CARDS */}
        {isMobile && (
          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {filtered.length === 0 ? (
              <div style={{ textAlign:'center', padding:'48px 20px', color:'var(--muted)', fontSize:13 }}>Aucun client trouvé.</div>
            ) : filtered.map(c => {
              const color = AVATAR_COLORS[c.id % AVATAR_COLORS.length];
              return (
                <div key={c.id} style={{ background:'#fff', borderRadius:12, overflow:'hidden', boxShadow:'0 1px 3px rgba(0,0,0,0.06)' }}
                  onClick={()=>setFiche(c)}>
                  <div style={{ padding:'13px 14px', display:'flex', alignItems:'center', gap:10 }}>
                    <div style={{ width:42,height:42,borderRadius:'50%',background:color,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0 }}>
                      <span style={{ fontSize:16,fontWeight:700,color:'#fff' }}>{c.name[0]}</span>
                    </div>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:'flex', alignItems:'center', gap:6, flexWrap:'wrap' }}>
                        <span style={{ fontWeight:700, fontSize:14, color:'var(--text)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{c.name}</span>
                        {c.default && (
                          <span style={{ display:'inline-flex', alignItems:'center', gap:4, background:'#eff6ff', color:'var(--primary)', fontSize:9, fontWeight:700, padding:'1px 6px', borderRadius:20, flexShrink:0 }}>
                            <Icon name="shield" size={9} color="var(--primary)" sw={2.5}/> Défaut
                          </span>
                        )}
                      </div>
                      <div style={{ fontSize:11, color:'var(--muted)', marginTop:2, display:'flex', alignItems:'center', gap:6 }}>
                        {c.phone!=='—' && <><Icon name="phone" size={10} color="var(--muted)" sw={1.8}/>{c.phone}</>}
                        {c.adresse!=='—' && <><Icon name="map" size={10} color="var(--muted)" sw={1.8}/>{c.adresse}</>}
                      </div>
                    </div>
                    <div style={{ textAlign:'right', flexShrink:0 }}>
                      <div style={{ fontWeight:800, fontSize:13, color:'var(--green)' }}>{fmt(c.total)}</div>
                      <div style={{ fontSize:10, color:'var(--muted)', marginTop:2 }}>{c.lastVisit.split('-').reverse().join('/')}</div>
                    </div>
                  </div>
                  {/* Mobile actions */}
                  <div style={{ borderTop:'1px solid #f3f4f6', display:'flex' }} onClick={e=>e.stopPropagation()}>
                    {[
                      { icon:'eye',   label:'Fiche',     color:'var(--primary)', action:()=>setFiche(c),   disabled:false },
                      { icon:'edit',  label:'Modifier',  color:'var(--primary)', action:()=>setModal(c),   disabled:c.default },
                      { icon:'trash', label:'Supprimer', color:'var(--red)',     action:()=>setDelTarget(c),disabled:c.default },
                    ].map((a,i,arr)=>(
                      <button key={a.icon} onClick={a.disabled?undefined:a.action}
                        style={{ flex:1, padding:'9px 4px', background:'none', border:'none', borderRight:i<arr.length-1?'1px solid #f3f4f6':'none', cursor:a.disabled?'not-allowed':'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:3, opacity:a.disabled?0.35:1 }}
                        onMouseEnter={e=>{ if(!a.disabled) e.currentTarget.style.background='#f9fafb'; }}
                        onMouseLeave={e=>e.currentTarget.style.background='none'}>
                        <Icon name={a.icon} size={14} color={a.color} sw={2}/>
                        <span style={{ fontSize:10, fontWeight:600, color:a.color }}>{a.label}</span>
                      </button>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {/* MODALS */}
      {modal && <ClientModal client={modal==='new'?null:modal} onSave={saveClient} onClose={()=>setModal(null)}/>}
      {delTarget && <DeleteConfirm client={delTarget} onConfirm={()=>deleteClient(delTarget.id)} onCancel={()=>setDelTarget(null)}/>}
      {fiche && <FichePanel client={fiche} onClose={()=>setFiche(null)} isMobile={isMobile}/>}
    </div>
  );
}

// ── App ────────────────────────────────────────────────────
function App() {
  return (
    <DesignCanvas>
      <DCSection title="StockFlow — Gestion des Clients" subtitle="Desktop (tableau) et Mobile (cards). Clic sur une ligne → fiche client.">
        <DCArtboard label="Desktop — 1280×800" width={1280} height={800}>
          <ClientsScreen isMobile={false}/>
        </DCArtboard>
        <DCArtboard label="Mobile — 390×844" width={390} height={844}>
          <ClientsScreen isMobile={true}/>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
